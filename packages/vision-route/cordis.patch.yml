# dsh-vision-proxy-route bundle patch (vision-route package)
#
# Installed through the official CLI:
#
#   dsh plugin --profile <name> add dsh-vision-proxy-route
#
# The profile boot merges this patch (a single `insert` of the host plugin
# row): a `deepseek-vision` route that declares image input and transcribes
# pasted images with the free Zhipu GLM vision models before the DeepSeek call.
- insert:
    - id: dsh-vision-proxy-route
      name: dsh-vision-proxy-route
