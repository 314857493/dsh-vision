name: check

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 模块形态检查（vision-tool，零依赖）
        run: node test-shape.mjs
        working-directory: packages/vision-tool

      - name: 行为测试（vision-tool，零依赖）
        run: node test-behavior.mjs
        working-directory: packages/vision-tool

      - name: 模块形态检查（vision-route，零依赖）
        run: node test-shape.mjs
        working-directory: packages/vision-route

      - name: Provider 映射测试（vision-route，零依赖）
        run: node test-provider-mapping.mjs
        working-directory: packages/vision-route

      - name: 发布内容校验（vision-tool）
        run: npm pack --dry-run
        working-directory: packages/vision-tool

      - name: 发布内容校验（vision-route）
        run: npm pack --dry-run
        working-directory: packages/vision-route
